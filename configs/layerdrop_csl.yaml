# Whole-block (layer) dropping of the T5 encoder / decoder followed by the same
# recovery fine-tune as configs/prune_csl.yaml. Validation on the dev split.
model:
  target: spamo.t5_slt.FlanT5SLT
  
  params:     
    lr: 2.0e-4
    monitor: val/bleu4
    model_name: bigscience/mt0-xl
    cache_dir: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/hf_cache
    inter_hidden: 768
    input_size: 2048
    beam_size: 5
    max_frame_len: 512
    max_txt_len: 64
    frame_sample_rate: 1
    prompt: "Translate the given sentence into {}."
    tuning_type: lora
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    fusion_mode: joint
    warm_up_steps: 0
    cross_modal_align: true
    combined_loss: true
    alpha: 1.0
    use_in_context: false
    num_in_context: 0

lightning:
  callback:
    learning_rate_logger:
      target: pytorch_lightning.callbacks.LearningRateMonitor
      params:
        logging_interval: step
  trainer:
    accumulate_grad_batches: 2
    accelerator: gpu
    devices: 1
    max_epochs: 60
    gradient_clip_val: 1.0
    check_val_every_n_epoch: 2
    precision: bf16

data:
  target: dataset.datamodule.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
  
    train:
      target: dataset.csl_daily.CSLDaily
      params:
        anno_root: ./preprocess/CSL-Daily
        vid_root: /pfs/work9/workspace/scratch/ka_uvelk-datasets/CSL-Daily
        feat_root: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/clip-vit-large-patch14_feat_CSL-Daily
        mae_feat_root: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/mae_feat_CSL-Daily
        mode: train
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
        
    validation:
      target: dataset.csl_daily.CSLDaily
      params:
        anno_root: ./preprocess/CSL-Daily
        vid_root: /pfs/work9/workspace/scratch/ka_uvelk-datasets/CSL-Daily
        feat_root: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/clip-vit-large-patch14_feat_CSL-Daily
        mae_feat_root: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/mae_feat_CSL-Daily
        mode: dev
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8
    
    test:
      target: dataset.csl_daily.CSLDaily
      params:
        anno_root: ./preprocess/CSL-Daily
        vid_root: /pfs/work9/workspace/scratch/ka_uvelk-datasets/CSL-Daily
        feat_root: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/clip-vit-large-patch14_feat_CSL-Daily
        mae_feat_root: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/mae_feat_CSL-Daily
        mode: test
        spatial: true
        spatiotemporal: true
        spatial_postfix: _s2wrapping
        spatiotemporal_postfix: _overlap-8

# One-shot structured pruning of the T5 attention heads / FFN neurons of a trained
# checkpoint (--ckpt), followed by a short LoRA recovery fine-tune. Same recipe as
# configs/prune.yaml (Phoenix14T); validation runs on the CSL-Daily dev split.
pruning:
  head_ratio: 0.0           # overridden by --head_ratio
  ffn_ratio: 0.0            # overridden by --ffn_ratio
  scope: per_layer          # per_layer | global
  num_calib_batches: 256
  scores_path: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/prune_scores_csl.pt
  eval_before_recovery: true
  drop_encoder: 0            # overridden by --drop_encoder
  drop_decoder: 0            # overridden by --drop_decoder
  # blocks are ranked by this scripts/layer_scan.py result (same checkpoint)
  layer_scan: /pfs/work9/workspace/scratch/ka_uvelk-models/SpaMo/layer_scan/csl_dev.json
